<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>Trader Academy PRO V2</title><style>
:root{--bg:#071018;--card:#0d1a24;--line:#203844;--text:#f4f7f8;--muted:#91a3ad;--green:#19e66f;--red:#ff5b6e;--gold:#f5bd32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{min-height:100vh;padding-bottom:95px}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 18px 12px;max-width:980px;margin:auto}.brand{font-size:27px;font-weight:800}.pro{font-size:13px;color:var(--gold);border:1px solid #9a7516;border-radius:12px;padding:5px 9px}.gear{background:#102630;border-radius:18px;padding:13px;font-size:20px}main{max-width:980px;margin:auto;padding:0 16px}.hero{margin-top:8px;padding:27px 24px;border:1px solid #174653;border-radius:30px;background:linear-gradient(135deg,#082c25,#0c1c2a)}.hero h1{font-size:34px;margin:0 0 12px}.hero p{font-size:18px;line-height:1.45;margin:0 0 20px}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary,.buy,.sell{padding:14px 20px;border-radius:15px;font-weight:800}.primary{background:var(--green);color:#00170b}.secondary{background:#172c38}.buy{background:#0bbf5b}.sell{background:#9f2738}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:20px}.stat .label{color:var(--muted);font-weight:700}.big{font-size:38px;font-weight:800;margin:7px 0}.bar{height:10px;background:#1a303a;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.section{margin-top:22px}.section h2{font-size:25px;margin:0 0 12px}.lesson,.option,.trade-row,.badge{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.lesson{display:flex;justify-content:space-between;align-items:center;gap:10px}.lesson small,.muted{color:var(--muted)}.pill{font-size:12px;padding:6px 9px;border-radius:10px;background:#16353e;color:#a9bdc6}.question{font-size:21px;font-weight:750;line-height:1.4;margin:12px 0 18px}.option{text-align:left;width:100%;background:#0d1a24}.option.correct{border-color:var(--green)}.option.wrong{border-color:var(--red)}.notice{padding:14px;border-radius:15px;background:#10252e;color:#bdd0d7;margin-top:12px}.sim-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.price{font-size:34px;font-weight:800}.trade-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.trade-controls label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.trade-controls input,.trade-controls select{width:100%;background:#08141c;border:1px solid var(--line);color:white;border-radius:12px;padding:12px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.green{color:var(--green)}.red{color:var(--red)}.badge{display:inline-block;width:calc(50% - 14px);vertical-align:top}.badge b{display:block;margin-bottom:5px}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(7,16,24,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);z-index:10;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.nav button{background:transparent;color:var(--muted);font-size:11px;font-weight:700;padding:5px 2px}.nav button b{display:block;font-size:22px}.nav button.active{color:var(--green)}.hide{display:none}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#132d39;border:1px solid #315665;padding:12px 18px;border-radius:14px;z-index:30}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.nav{left:50%;right:auto;transform:translateX(-50%);width:min(900px,100%);border-radius:20px 20px 0 0}}
</style></head><body><div class="app"><header class="top"><div class="brand">📈 Trader Academy <span class="pro">PRO</span></div><button class="gear" onclick="toast('Ustawienia wkrótce 🔧')">⚙️</button></header><main id="screen"></main><nav class="nav"><button data-id="home" onclick="show('home')"><b>🏠</b>Home</button><button data-id="lessons" onclick="show('lessons')"><b>📚</b>Lekcje</button><button data-id="training" onclick="show('training')"><b>🎯</b>Trening</button><button data-id="sim" onclick="show('sim')"><b>📊</b>Simulator</button><button data-id="progress" onclick="show('progress')"><b>🏆</b>Postęp</button><button data-id="community" onclick="show('community')"><b>👥</b>Community</button></nav></div><div id="toast" class="toast hide"></div><script>
const K='TA_V2';let s=JSON.parse(localStorage.getItem(K)||'null')||{xp:2350,lessons:[],correct:0,answered:0,balance:10000,price:100,position:null,trades:[],q:0};function save(){localStorage.setItem(K,JSON.stringify(s))}function addxp(n){s.xp+=n;save()}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),1600)}function lvl(){return Math.floor(s.xp/350)+1}function nav(id){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.id===id))}function show(id){nav(id);({home,lessons,training,sim,progress,community}[id]||home)();scrollTo(0,0)}
const L=[['Podstawy tradingu','Rynek, broker, Bid/Ask, spread i typy zleceń.'],['Świece japońskie','Open, High, Low, Close i czytanie świecy.'],['Trend i struktura rynku','HH/HL, LH/LL, wybicia i zmiana charakteru.'],['Support & Resistance','Strefy reakcji ceny i potwierdzenie poziomu.'],['Risk Management','Ryzyko, SL, TP, wielkość pozycji i R:R.'],['Psychologia tradingu','FOMO, revenge trading, plan i dyscyplina.']];
const Q=[['Co najlepiej opisuje Stop Loss?',['Zlecenie ograniczające potencjalną stratę','Gwarantowany zysk','Opłata brokera','Rodzaj wskaźnika'],0],['Co oznacza spread?',['Różnica między Bid i Ask','Wielkość depozytu','Poziom SL','Rodzaj świecy'],0],['Ryzyko £100 i potencjalny zysk £300 daje R:R:',['1:3','3:1','1:1','2:1'],0],['FOMO to przede wszystkim:',['Strach przed przegapieniem ruchu','Kontrola ryzyka','Rodzaj zlecenia','Analiza fundamentalna'],0],['Trend wzrostowy typowo tworzy:',['Higher High i Higher Low','Lower High i Lower Low','Same szczyty','Brak korekt'],0]];
function home(){let p=(s.xp%350)/3.5;document.getElementById('screen').innerHTML=`<section class="hero"><h1>Witaj w Trader Academy 👋</h1><p>Ucz się czytać rynek, ćwicz decyzje i buduj dyscyplinę — bez ryzyka prawdziwych pieniędzy.</p><div class="actions"><button class="primary" onclick="show('training')">Rozpocznij trening</button><button class="secondary" onclick="show('lessons')">Lekcje</button></div></section><div class="grid"><div class="card stat"><div class="label">Poziom</div><div class="big">${lvl()}</div><b>${lvl()<10?'Timing Trader':lvl()<20?'Market Reader':'Pro Trader'}</b></div><div class="card stat"><div class="label">XP</div><div class="big">${s.xp}</div><div class="bar"><i style="width:${p}%"></i></div></div><div class="card stat"><div class="label">Poprawne</div><div class="big">${s.correct}</div><b>${s.answered?Math.round(s.correct/s.answered*100):0}%</b></div><div class="card stat"><div class="label">Kapitał demo</div><div class="big">£${s.balance.toFixed(0)}</div><b>${s.trades.length} transakcji</b></div></div><section class="section"><div class="card"><h2>⭐ Rada dnia</h2><p class="question">Nie wchodź tylko dlatego, że widzisz dużą świecę.</p><p class="muted">Najpierw plan, ryzyko i kontekst rynku. Najlepsza transakcja czasem jest tą, której nie zawierasz.</p></div></section>`}
function lessons(){document.getElementById('screen').innerHTML=`<section class="section"><h2>📚 Lekcje</h2><p class="muted">Ukończone ${s.lessons.length}/${L.length}</p>${L.map((x,i)=>`<div class="lesson" onclick="lesson(${i})"><div><b>${i+1}. ${x[0]}</b><br><small>${x[1]}</small></div><span class="pill">${s.lessons.includes(i)?'✓ Ukończona':'+100 XP'}</span></div>`).join('')}</section>`}
function lesson(i){let tips=['Trading to proces podejmowania decyzji na rynku. Poznaj Bid, Ask, spread oraz zlecenia Market, Limit i Stop.','Świeca pokazuje Open, High, Low i Close. Korpus i knoty dają kontekst, ale pojedyncza świeca nie jest samodzielnym sygnałem.','Trend wzrostowy tworzy Higher High i Higher Low, a spadkowy Lower High i Lower Low. Najpierw określ strukturę.','Support i resistance lepiej traktować jako strefy niż idealne linie. Szukaj reakcji i potwierdzenia.','Ryzyko ustalasz przed wejściem. Wielkość pozycji zależy od SL i kwoty, którą akceptujesz jako stratę.','FOMO i revenge trading niszczą plan. Dziennik, limity ryzyka i powtarzalny proces pomagają zachować dyscyplinę.'];document.getElementById('screen').innerHTML=`<section class="section"><button class="secondary" onclick="lessons()">← Lekcje</button><div class="card" style="margin-top:12px"><span class="pill">LEKCJA ${i+1}</span><h2>${L[i][0]}</h2><p class="question">${tips[i]}</p><div class="notice">💡 Zapamiętaj: analiza nie usuwa ryzyka — kontrola ryzyka ogranicza konsekwencje błędu.</div><button class="primary" style="margin-top:14px" onclick="done(${i})">${s.lessons.includes(i)?'Ukończona ✓':'Oznacz jako ukończoną +100 XP'}</button></div></section>`}function done(i){if(!s.lessons.includes(i)){s.lessons.push(i);addxp(100);toast('+100 XP 🎉')}lessons()}
function training(){let q=Q[s.q%Q.length];document.getElementById('screen').innerHTML=`<section class="section"><div class="card"><span class="pill">PYTANIE ${s.q%Q.length+1}/${Q.length}</span><div class="question">${q[0]}</div>${q[1].map((x,i)=>`<button class="option" onclick="ans(${i},${q[2]})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}<div id="fb"></div></div><div class="notice">🎯 Myśl jak trader: proces i ryzyko przed potencjalnym zyskiem.</div></section>`}function ans(i,c){document.querySelectorAll('.option').forEach(x=>x.disabled=true);s.answered++;let ok=i===c;if(ok){s.correct++;addxp(50)}else save();document.getElementById('fb').innerHTML=`<div class="notice">${ok?'✅ Dobrze! +50 XP':'❌ Nie tym razem.'}<br><button class="${ok?'primary':'secondary'}" style="margin-top:10px" onclick="s.q++;save();training()">Następne pytanie</button></div>`;save()}
function sim(){let p=s.price,pos=s.position;document.getElementById('screen').innerHTML=`<section class="section"><div class="card"><div class="sim-head"><div><span class="pill">PAPER TRADING</span><div class="price">£${p.toFixed(2)}</div></div><div><div class="muted">Saldo</div><b style="font-size:24px">£${s.balance.toFixed(2)}</b></div></div><p class="muted">Symulator edukacyjny. Bez prawdziwych pieniędzy.</p><div class="trade-controls"><div><label>Pozycja (£)</label><input id="size" type="number" value="500" min="10"></div><div><label>SL %</label><input id="sl" type="number" value="1" step=".1" min=".1"></div><div><label>TP %</label><input id="tp" type="number" value="2" step=".1" min=".1"></div><div><label>Kierunek</label><select id="dir"><option value="long">BUY / Long</option><option value="short">SELL / Short</option></select></div></div><div class="actions" style="margin-top:12px"><button class="buy" onclick="openT()">BUY / OPEN</button><button class="sell" onclick="openT()">SELL / OPEN</button><button class="secondary" onclick="move()">Przesuń rynek ↗</button></div>${pos?`<div class="notice">📌 ${pos.dir.toUpperCase()} £${pos.size} @ £${pos.entry.toFixed(2)}<br>SL £${pos.sl.toFixed(2)} | TP £${pos.tp.toFixed(2)}<br>P/L: <b class="${pl()>=0?'green':'red'}">£${pl().toFixed(2)}</b><br><button class="primary" style="margin-top:10px" onclick="closeT()">Zamknij pozycję</button></div>`:'<div class="notice">Brak otwartej pozycji. Ustaw parametry i otwórz demo trade.</div>'}</div></section><section class="section"><div class="card"><h2>Historia</h2>${s.trades.length?`<table class="table"><tr><th>Strona</th><th>Wejście</th><th>Wyjście</th><th>P/L</th></tr>${s.trades.slice().reverse().map(t=>`<tr><td>${t.dir}</td><td>£${t.entry.toFixed(2)}</td><td>£${t.exit.toFixed(2)}</td><td class="${t.pnl>=0?'green':'red'}">£${t.pnl.toFixed(2)}</td></tr>`).join('')}</table>`:'<p class="muted">Brak transakcji.</p>'}</div></section>`}function openT(){if(s.position){toast('Najpierw zamknij obecną pozycję');return}let size=+document.getElementById('size').value,sl=+document.getElementById('sl').value,tp=+document.getElementById('tp').value,dir=document.getElementById('dir').value;if(size<10)return;s.position={dir,size,entry:s.price,sl:dir==='long'?s.price*(1-sl/100):s.price*(1+sl/100),tp:dir==='long'?s.price*(1+tp/100):s.price*(1-tp/100)};save();toast('Pozycja otwarta 📊');sim()}function pl(){if(!s.position)return 0;let x=(s.price-s.position.entry)/s.position.entry*s.position.size;return s.position.dir==='long'?x:-x}function move(){s.price=Math.max(10,s.price*(1+(Math.random()-.46)*3/100));if(s.position){let p=s.position;if((p.dir==='long'&&(s.price<=p.sl||s.price>=p.tp))||(p.dir==='short'&&(s.price>=p.sl||s.price<=p.tp))){closeT(true);return}}save();sim()}function closeT(auto=false){if(!s.position)return;let x=pl();s.balance+=x;s.trades.push({dir:s.position.dir==='long'?'BUY':'SELL',entry:s.position.entry,exit:s.price,pnl:x});s.position=null;save();toast((auto?'Auto: ':'Zamknięto: ')+'£'+x.toFixed(2));sim()}
function progress(){let a=s.answered?Math.round(s.correct/s.answered*100):0;document.getElementById('screen').innerHTML=`<section class="section"><h2>🏆 Twój postęp</h2><div class="grid"><div class="card stat"><div class="label">Poziom</div><div class="big">${lvl()}</div><b>${lvl()<10?'Timing Trader':lvl()<20?'Market Reader':'Pro Trader'}</b></div><div class="card stat"><div class="label">XP</div><div class="big">${s.xp}</div></div><div class="card stat"><div class="label">Lekcje</div><div class="big">${s.lessons.length}/${L.length}</div></div><div class="card stat"><div class="label">Celność</div><div class="big">${a}%</div></div></div></section><section class="section"><div class="card"><h2>🎖️ Odznaki</h2><div class="badge"><b>🔥 Pierwszy trening</b><span class="muted">${s.answered?'Odblokowana':'Zablokowana'}</span></div><div class="badge"><b>📚 Uczeń</b><span class="muted">${s.lessons.length>=3?'Odblokowana':'Ukończ 3 lekcje'}</span></div><div class="badge"><b>🎯 Celność</b><span class="muted">${s.correct>=5?'Odblokowana':'Zdobądź 5 poprawnych'}</span></div><div class="badge"><b>📈 Trader</b><span class="muted">${s.trades.length>=5?'Odblokowana':'Wykonaj 5 transakcji demo'}</span></div></div></section>`}function community(){document.getElementById('screen').innerHTML=`<section class="section"><div class="card"><h2>👥 Community</h2><p class="question">Strefa społeczności Trader Academy</p><p class="muted">Tutaj w kolejnym etapie dodamy profile, rankingi, komentarze, wyzwania i tablicę wyników.</p><div class="notice">🚀 Fundament Community jest już gotowy.</div></div></section><section class="section"><div class="card"><h2>🏅 Wyzwanie tygodnia</h2><p>Odpowiedz poprawnie na 10 pytań treningowych.</p><button class="primary" onclick="show('training')">Podejmij wyzwanie</button></div></section>`}show('home');
</script></body></html>
