<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071018">
<title>Trader Academy PRO V2</title>

<style>
:root{
--bg:#071018;--card:#0d1a24;--line:#203844;
--text:#f4f7fb;--muted:#91a3ad;--green:#19e66f;
--red:#ff5b6e;--gold:#f5bd32;--blue:#36a8ff
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;padding-bottom:90px}
.top{padding:22px 28px 15px;display:flex;align-items:center;
justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-size:28px;font-weight:800}
.pro{font-size:13px;color:var(--gold);border:1px solid var(--gold);
border-radius:12px;padding:5px 9px;margin-left:8px}
.gear{background:var(--card);color:white;border:1px solid var(--line);
border-radius:18px;padding:12px;font-size:22px}
.screen{max-width:1100px;margin:auto;padding:25px}
.hero,.card{background:var(--card);border:1px solid var(--line);
border-radius:24px;padding:28px;margin-bottom:20px}
.hero{background:linear-gradient(135deg,#063328,#0d1a24)}
h1{font-size:42px;margin:0 0 12px}
h2{font-size:27px;margin-top:0}
h3{margin-bottom:8px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{background:var(--card);border:1px solid var(--line);
border-radius:22px;padding:22px}
.big{font-size:38px;font-weight:800}
.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:800;
margin:5px}
.primary{background:var(--green);color:#03140a}
.secondary{background:#142c39;color:white;border:1px solid var(--line)}
.danger{background:var(--red);color:white}
.gold{color:var(--gold)}
.progress{height:12px;background:#172b35;border-radius:20px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#08131c;
border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);
z-index:10}
.nav button{background:none;border:0;color:var(--muted);padding:10px 4px;font-size:13px}
.nav button.active{color:var(--green)}
.icon{display:block;font-size:24px}
.lesson{border:1px solid var(--line);border-radius:18px;padding:18px;
margin:10px 0;background:#0b1821}
.lesson.done{border-color:var(--green)}
.quiz-option{display:block;width:100%;text-align:left;background:#101f2a;
color:white;border:1px solid var(--line);border-radius:14px;
padding:15px;margin:9px 0}
.quiz-option:hover{border-color:var(--blue)}
.good{border-color:var(--green)!important}
.bad{border-color:var(--red)!important}
input,select{width:100%;padding:13px;border-radius:12px;
border:1px solid var(--line);background:#09151e;color:white;margin:6px 0 14px}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left}
.price{font-size:42px;font-weight:800}
.buy{color:var(--green)}
.sell{color:var(--red)}
@media(max-width:700px){
h1{font-size:31px}.screen{padding:16px}.hero{padding:22px}
.grid,.stats{grid-template-columns:1fr 1fr}.top{padding:18px}
.brand{font-size:22px}.nav button{font-size:11px}
}
</style>
</head>

<body>
<div class="app">

<header class="top">
<div class="brand">📈 Trader Academy <span class="pro">PRO</span></div>
<button class="gear" onclick="settings()">⚙️</button>
</header>

<main id="screen" class="screen"></main>

<nav class="nav">
<button data-id="home" onclick="show('home')"><span class="icon">🏠</span>Home</button>
<button data-id="lessons" onclick="show('lessons')"><span class="icon">📚</span>Lekcje</button>
<button data-id="training" onclick="show('training')"><span class="icon">🎯</span>Trening</button>
<button data-id="sim" onclick="show('sim')"><span class="icon">📊</span>Simulator</button>
<button data-id="progress" onclick="show('progress')"><span class="icon">🏆</span>Postęp</button>
<button data-id="community" onclick="show('community')"><span class="icon">👥</span>Community</button>
</nav>
</div>

<script>
const KEY="TRADER_ACADEMY_V2";
let s=JSON.parse(localStorage.getItem(KEY)||"null")||{
xp:2350,level:7,correct:0,answered:0,streak:0,balance:10000,
price:100,position:null,trades:[],lessons:[],risk:1
};

function save(){localStorage.setItem(KEY,JSON.stringify(s));}

const lessons=[
["Podstawy tradingu","Rynek, broker, Bid/Ask, spread i typy zleceń."],
["Świece japońskie","Open, High, Low, Close i interpretacja świec."],
["Trend","Trend wzrostowy, spadkowy i konsolidacja."],
["Wsparcie i opór","Jak znaleźć kluczowe poziomy cenowe."],
["Stop Loss","Ograniczanie straty i ochrona kapitału."],
["Take Profit","Planowanie realizacji zysku."],
["Risk Management","Ryzyko na transakcję, R:R i wielkość pozycji."],
["Psychologia","Emocje, dyscyplina i unikanie revenge trading."],
["Price Action","Czytanie zachowania ceny bez zgadywania."],
["Plan tradingowy","Jak stworzyć i przestrzegać własnego planu."]
];

const questions=[
["Co oznacza spread?",["Różnicę Bid/Ask","Prowizję banku","Stop Loss"],0],
["Do czego służy Stop Loss?",["Do zwiększenia ryzyka","Do ograniczenia potencjalnej straty","Do wypłaty zysku"],1],
["Co oznacza R:R 1:3?",["Ryzykujesz 3 aby zarobić 1","Ryzykujesz 1 aby potencjalnie zarobić 3","Brak ryzyka"],1],
["Co jest ważniejsze od pojedynczej transakcji?",["Plan i zarządzanie ryzykiem","Duża pozycja","Szybkość wejścia"],0],
["Co oznacza trend wzrostowy?",["Niższe szczyty","Wyższe szczyty i dołki","Brak ruchu"],1],
["Czym jest revenge trading?",["Handlowaniem z planem","Próbą odrobienia straty pod wpływem emocji","Analizą rynku"],1],
["Co robi Take Profit?",["Automatycznie realizuje zysk przy określonej cenie","Zwiększa spread","Otwiera konto"],0],
["Dlaczego nie warto ryzykować dużej części kapitału?",["Bo jedna strata może mocno uszkodzić konto","Bo rynek jest zamknięty","Bo nie ma wykresów"],0]
];

function level(){
return Math.max(1,Math.floor(s.xp/350)+1);
}

function nav(id){
document.querySelectorAll(".nav button").forEach(x=>
x.classList.toggle("active",x.dataset.id===id));
}

function show(id){
nav(id);
if(id==="home")home();
if(id==="lessons")lessons();
if(id==="training")training();
if(id==="sim")sim();
if(id==="progress")progress();
if(id==="community")community();
window.scrollTo(0,0);
}

function home(){
s.level=level();
let pct=Math.min(100,(s.xp%350)/3.5);
document.getElementById("screen").innerHTML=`
<section class="hero">
<h1>Witaj w Trader Academy 👋</h1>
<p>Ucz się czytać rynek, ćwicz decyzje i buduj dyscyplinę — bez ryzyka prawdziwych pieniędzy.</p>
<button class="btn primary" onclick="show('training')">Rozpocznij trening</button>
<button class="btn secondary" onclick="show('lessons')">📚 Lekcje</button>
</section>

<div class="stats">
<div class="stat"><span class="muted">Poziom</span><div class="big">${s.level}</div><b>Trader</b></div>
<div class="stat"><span class="muted">XP</span><div class="big">${s.xp}</div>
<div class="progress"><i style="width:${pct}%"></i></div></div>
<div class="stat"><span class="muted">Poprawne</span><div class="big">${s.correct}</div>
<b>${s.answered?Math.round(s.correct/s.answered*100):0}%</b></div>
<div class="stat"><span class="muted">Kapitał demo</span><div class="big">£${s.balance.toFixed(0)}</div>
<b>${s.trades.length} transakcji</b></div>
</div>

<section class="card">
<h2>⭐ Rada dnia</h2>
<p>Nie wchodź w pozycję tylko dlatego, że widzisz dużą świecę. Najpierw sprawdź trend, poziom, ryzyko i stosunek R:R.</p>
</section>`;
}

function lessons(){
let html=`<section class="card"><h2>📚 Akademia — lekcje</h2>
<p class="muted">Ukończ lekcje, aby zdobywać XP.</p>`;
lessons.forEach((l,i)=>{
let done=s.lessons.includes(i);
html+=`<div class="lesson ${done?'done':''}">
<h3>${done?'✅':'📖'} ${i+1}. ${l[0]}</h3>
<p class="muted">${l[1]}</p>
<button class="btn ${done?'secondary':'primary'}" onclick="openLesson(${i})">
${done?'Powtórz':'Rozpocznij'}
</button></div>`;
});
html+=`</section>`;
document.getElementById("screen").innerHTML=html;
}

function openLesson(i){
let tips=[
"Bid to cena sprzedaży, Ask to cena kupna. Spread to różnica pomiędzy nimi.",
"Świeca pokazuje Open, High, Low i Close. Zawsze analizuj ją w kontekście rynku.",
"Trend wzrostowy tworzy wyższe szczyty i wyższe dołki.",
"Wsparcie może zatrzymywać spadki, a opór może zatrzymywać wzrosty.",
"Stop Loss powinien być ustawiony przed wejściem i wynikać z planu.",
"Take Profit określa miejsce, w którym planujesz realizację zysku.",
"Nie ryzykuj pieniędzy, których nie możesz stracić. Stałe ryzyko pomaga przetrwać serię strat.",
"Emocje są częścią tradingu. Dyscyplina oznacza wykonywanie planu także po stracie.",
"Price Action to analiza zachowania ceny, a nie przewidywanie przyszłości.",
"Dobry plan powinien określać wejście, SL, TP, ryzyko i warunki wyjścia."
];
document.getElementById("screen").innerHTML=`
<section class="card">
<h2>📖 Lekcja ${i+1}: ${lessons[i][0]}</h2>
<p>${tips[i]}</p>
<hr style="border-color:#203844">
<h3>Najważniejsza zasada</h3>
<p class="muted">Nie próbuj przewidzieć rynku. Buduj scenariusz i zarządzaj ryzykiem.</p>
<button class="btn primary" onclick="completeLesson(${i})">✅ Oznacz jako ukończoną +50 XP</button>
<button class="btn secondary" onclick="show('lessons')">← Wróć</button>
</section>`;
}

function completeLesson(i){
if(!s.lessons.includes(i)){
s.lessons.push(i);s.xp+=50;save();
}
lessons();
}

let qIndex=0;

function training(){
let q=questions[qIndex%questions.length];
document.getElementById("screen").innerHTML=`
<section class="card">
<h2>🎯 Trening decyzji</h2>
<p class="muted">Pytanie ${qIndex%questions.length+1} / ${questions.length}</p>
<h3>${q[0]}</h3>
${q[1].map((x,i)=>`<button class="quiz-option" onclick="answer(${i},${q[2]})">${x}</button>`).join("")}
</section>
<section class="card">
🔥 Seria: <b>${s.streak}</b> &nbsp; | &nbsp; XP: <b>${s.xp}</b>
</section>`;
}

function answer(choice,correct){
s.answered++;
if(choice===correct){
s.correct++;s.streak++;s.xp+=25;
alert("✅ Dobra odpowiedź! +25 XP");
}else{
s.streak=0;
alert("❌ Nie tym razem. Przeczytaj lekcje i spróbuj ponownie.");
}
qIndex++;save();training();
}

function sim(){
let p=s.price.toFixed(2);
document.getElementById("screen").innerHTML=`
<section class="card">
<h2>📊 Trading Simulator</h2>
<p class="muted">Wirtualny kapitał — żadnych prawdziwych pieniędzy.</p>
<div class="price">£${p}</div>
<p>Status: ${s.position?`<b class="${s.position.type==='BUY'?'buy':'sell'}">${s.position.type} ${s.position.qty}</b>`:"Brak pozycji"}</p>
<button class="btn primary" onclick="openTrade('BUY')">🟢 BUY</button>
<button class="btn danger" onclick="openTrade('SELL')">🔴 SELL</button>
<button class="btn secondary" onclick="movePrice()">🎲 Ruch ceny</button>
${s.position?`<button class="btn gold" onclick="closeTrade()">💰 Zamknij pozycję</button>`:""}
</section>

<section class="card">
<h2>🧮 Risk Management</h2>
<label>Kapitał</label>
<input id="capital" type="number" value="${s.balance.toFixed(0)}">
<label>Ryzyko %</label>
<input id="risk" type="number" value="${s.risk}" step="0.1">
<label>Stop Loss — punkty</label>
<input id="sl" type="number" value="2" step="0.1">
<button class="btn primary" onclick="calcRisk()">Oblicz pozycję</button>
<div id="riskResult"></div>
</section>

<section class="card">
<h2>📜 Historia transakcji</h2>
${s.trades.length?`<table><tr><th>Typ</th><th>Wejście</th><th>Wyjście</th><th>Wynik</th></tr>
${s.trades.slice(-10).reverse().map(t=>`<tr><td>${t.type}</td><td>£${t.entry.toFixed(2)}</td><td>£${t.exit.toFixed(2)}</td><td>${t.pnl>=0?'🟢':'🔴'} £${t.pnl.toFixed(2)}</td></tr>`).join("")}</table>`:"<p class='muted'>Brak transakcji.</p>"}
</section>`;
}

function openTrade(type){
if(s.position){alert("Najpierw zamknij obecną pozycję.");return}
s.position={type,entry:s.price,qty:1};
save();sim();
}

function movePrice(){
let change=(Math.random()-0.47)*5;
s.price=Math.max(10,s.price+change);
save();sim();
}

function closeTrade(){
if(!s.position)return;
let p=s.position;
let pnl=p.type==="BUY"?(s.price-p.entry)*p.qty:(p.entry-s.price)*p.qty;
s.balance+=pnl;
s.trades.push({type:p.type,entry:p.entry,exit:s.price,pnl});
s.position=null;
if(pnl>0)s.xp+=20;
save();sim();
}

function calcRisk(){
let c=Number(document.getElementById("capital").value);
let r=Number(document.getElementById("risk").value);
let sl=Number(document.getElementById("sl").value);
let money=c*r/100;
let qty=sl?money/sl:0;
document.getElementById("riskResult").innerHTML=
`<div class="lesson"><b>Ryzyko:</b> £${money.toFixed(2)}<br>
<b>Maksymalna wielkość pozycji:</b> ${qty.toFixed(2)} jednostki</div>`;
}

function progress(){
let accuracy=s.answered?Math.round(s.correct/s.answered*100):0;
let completed=s.lessons.length;
document.getElementById("screen").innerHTML=`
<section class="card">
<h2>🏆 Twój postęp</h2>
<div class="stats">
<div class="stat"><span class="muted">Poziom</span><div class="big">${level()}</div></div>
<div class="stat"><span class="muted">XP</span><div class="big">${s.xp}</div></div>
<div class="stat"><span class="muted">Skuteczność</span><div class="big">${accuracy}%</div></div>
<div class="stat"><span class="muted">Lekcje</span><div class="big">${completed}/${lessons.length}</div></div>
</div>
</section>

<section class="card">
<h2>🏅 Odznaki</h2>
<p>${completed>=1?'🥉 Pierwsza lekcja':'🔒 Pierwsza lekcja — zablokowana'}</p>
<p>${s.correct>=5?'🥈 5 poprawnych odpowiedzi':'🔒 5 poprawnych odpowiedzi — zablokowana'}</p>
<p>${s.streak>=5?'🔥 Seria 5 odpowiedzi':'🔒 Seria 5 odpowiedzi — zablokowana'}</p>
<p>${s.trades.length>=10?'🏆 10 transakcji demo':'🔒 10 transakcji demo — zablokowana'}</p>
</section>

<section class="card">
<h2>📈 Statystyki</h2>
<p>Wszystkich pytań: <b>${s.answered}</b></p>
<p>Poprawnych: <b>${s.correct}</b></p>
<p>Transakcji demo: <b>${s.trades.length}</b></p>
<p>Kapitał: <b>£${s.balance.toFixed(2)}</b></p>
</section>`;
}

function community(){
document.getElementById("screen").innerHTML=`
<section class="card">
<h2>👥 Community</h2>
<p>Trader Academy Community</p>
<p class="muted">Tutaj w kolejnej wersji możemy dodać ranking traderów,
daily challenge, komentarze i wspólne wyzwania.</p>
<div class="lesson"><h3>🔥 Wyzwanie tygodnia</h3>
<p>Wykonaj 20 pytań treningowych i utrzymaj skuteczność minimum 70%.</p></div>
</section>

<section class="card">
<h2>💡 Zasada społeczności</h2>
<p>Nie chwalimy się pojedynczą transakcją. Uczymy się procesu,
zarządzania ryzykiem i konsekwencji.</p>
</section>`;
}

function settings(){
document.getElementById("screen").innerHTML=`
<section class="card">
<h2>⚙️ Ustawienia</h2>
<p>Postęp jest automatycznie zapisywany w przeglądarce.</p>
<button class="btn danger" onclick="resetApp()">♻️ Resetuj cały postęp</button>
<button class="btn secondary" onclick="show('home')">← Wróć</button>
</section>`;
}

function resetApp(){
if(confirm("Na pewno usunąć cały postęp?")){
localStorage.removeItem(KEY);location.reload();
}
}

show("home");
</script>
</body>
</html>
